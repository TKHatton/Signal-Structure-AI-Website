[build]
  # Tests gate the deploy: a failing test stops the build.
  command = "npm test && npm run build"

[[plugins]]
  package = "@netlify/plugin-nextjs"

# Impact Circle sign-up page, served from its own Netlify site but shown at
# signalstructure.ai/circle so visitors stay on the main domain.
[[redirects]]
  from = "/circle"
  to = "https://impact-circle-signal.netlify.app/"
  status = 200
  force = true

[[redirects]]
  from = "/circle/*"
  to = "https://impact-circle-signal.netlify.app/:splat"
  status = 200
  force = true
